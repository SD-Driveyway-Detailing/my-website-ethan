<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quote Request Received | SD Driveway Detailing</title>
<meta name="robots" content="noindex,follow">
<style>
:root{--bg:#020407;--panel:#09101b;--blue:#087cff;--blue2:#20b8ff;--text:#f8fbff;--muted:#aebaca}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 0%,rgba(32,184,255,.16),transparent 36%),linear-gradient(180deg,#000,#050a12 55%,#020407)}
.card{width:min(640px,100%);padding:34px;border:1px solid rgba(216,225,236,.14);border-radius:24px;background:linear-gradient(180deg,rgba(12,22,36,.96),rgba(5,10,18,.96));box-shadow:0 28px 90px rgba(0,0,0,.52);text-align:center}
.check{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:rgba(8,124,255,.16);border:1px solid rgba(32,184,255,.4);font-size:34px}.eyebrow{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--blue2)}h1{font-size:clamp(30px,7vw,48px);line-height:1.02;margin:10px 0 14px}p{margin:0 auto 24px;max-width:520px;color:var(--muted);font-size:17px;line-height:1.6}.btn{display:inline-block;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));padding:14px 22px;border-radius:14px;font-weight:800;box-shadow:0 12px 30px rgba(8,124,255,.25)}.small{font-size:13px;margin-top:20px;color:#738398}
</style>
</head>
<body>
<main class="card">
  <div class="check">✓</div>
  <div class="eyebrow">SD Driveway Detailing</div>
  <h1>Quote request received.</h1>
  <p>Thanks — your request was sent successfully. We’ll review the vehicle and service details and contact you using the phone number you provided.</p>
  <a class="btn" href="/">Back to Home</a>
  <div class="small">Carlsbad &amp; North County San Diego mobile detailing</div>
</main>
</body>
</html>
